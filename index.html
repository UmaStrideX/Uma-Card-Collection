<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmaMusume Card Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-poppins flex flex-col relative">

<div id="toast-container" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2"></div>

<div id="confirm-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
  <div class="glass max-w-sm w-full p-8 rounded-3xl text-center shadow-2xl border border-white/10">
    <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <h3 class="text-xl font-bold mb-2">Tout effacer ?</h3>
    <p class="text-gray-400 text-sm mb-6">Cette action est irréversible. Votre collection sera définitivement supprimée.</p>
    <div class="flex gap-3">
      <button id="cancel-reset" class="flex-1 py-3 rounded-xl bg-gray-800 hover:bg-gray-700 font-bold transition">Annuler</button>
      <button id="confirm-reset" class="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-500 font-bold transition">Réinitialiser</button>
    </div>
  </div>
</div>

<div id="header-wrapper" class="sticky top-0 z-40 w-full transition-transform duration-300 ease-in-out">
  <div id="header-content" class="glass-header border-b border-white/5 shadow-2xl">
    <div class="container mx-auto p-4 md:p-6 flex flex-col gap-4">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div id="collection-stats" class="text-emerald-400 text-sm font-bold tracking-wider"></div>
        
        <div class="flex gap-3">
          <button id="toggle-view" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-2xl font-bold transition-all shadow-[0_0_15px_rgba(16,185,129,0.2)] active:scale-95 text-sm">
            Voir ma collection (0)
          </button>
          <button id="toggle-deck" class="hidden bg-purple-600 hover:bg-purple-500 text-white px-6 py-2.5 rounded-2xl font-bold transition-all shadow-[0_0_15px_rgba(147,51,234,0.2)] active:scale-95 text-sm">
            Deck Builder
          </button>
          <button id="open-reset-modal" class="bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-400 px-5 py-2.5 rounded-2xl transition-all border border-gray-700 active:scale-95 text-sm">
            Réinitialiser
          </button>
        </div>
      </div>

      <div id="filters" class="flex flex-col sm:flex-row gap-3 items-center justify-center">
        <div class="relative flex-1 w-full">
          <input type="text" id="search" placeholder="Rechercher une carte..." class="w-full p-3 rounded-xl bg-gray-900/40 border border-gray-700 focus:border-emerald-500 outline-none transition-all text-white text-sm">
        </div>
        <button id="globalFilterBtn" class="p-3 rounded-xl bg-gray-900/40 border border-gray-700 text-white text-sm font-bold transition-all hover:border-emerald-500 whitespace-nowrap">
          Global Only: OFF
        </button>
        <select id="rarityFilter" class="p-3 rounded-xl bg-gray-900/40 border border-gray-700 outline-none w-full sm:w-auto text-white cursor-pointer focus:border-emerald-500 text-sm">
          <option value="">Toutes raretés</option>
          <option value="SSR">SSR</option>
          <option value="SR">SR</option>
          <option value="R">R</option>
        </select>
        <select id="typeFilter" class="p-3 rounded-xl bg-gray-900/40 border border-gray-700 outline-none w-full sm:w-auto text-white cursor-pointer focus:border-emerald-500 text-sm">
          <option value="">Tous types</option>
          <option value="speed">Speed</option>
          <option value="stamina">Stamina</option>
          <option value="power">Power</option>
          <option value="guts">Guts</option>
          <option value="wit">Wit</option>
          <option value="friend">Friend</option>
          <option value="group">Group</option>
        </select>
      </div>

      <div id="collection-tools" class="hidden flex flex-col gap-3 border-t border-white/5 pt-4 mt-1">
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="importData" placeholder="Coller le code ici..." class="p-2.5 rounded-xl bg-gray-900/40 border border-gray-700 flex-1 outline-none text-white focus:border-emerald-500 text-xs">
          <button id="importBtn" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-xl font-bold transition active:scale-95 text-xs">Importer</button>
          <input type="file" id="importJsonFile" accept=".json" class="hidden">
          <button id="importJsonBtn" title="Importer un fichier JSON" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-xl transition active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
              </svg>
          </button>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="exportResult" readonly placeholder="Le code apparaîtra ici..." class="p-2.5 rounded-xl bg-gray-800/40 border border-gray-700 flex-1 text-xs text-gray-400 outline-none">
          <button id="exportBtn" class="bg-purple-600 hover:bg-purple-500 px-5 py-2 rounded-xl font-bold transition active:scale-95 text-white text-xs">Exporter</button>
          <button id="exportJsonBtn" title="Télécharger en JSON" class="bg-gray-700 hover:bg-gray-600 px-3 py-2 rounded-xl transition active:scale-95">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="flex justify-center -mt-[1px]">
    <button id="toggle-header" class="bg-gray-900/90 backdrop-blur-md border border-white/10 border-t-0 px-8 py-2 rounded-b-3xl text-emerald-400 hover:text-emerald-300 transition-all shadow-xl">
      <svg id="toggle-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
      </svg>
    </button>
  </div>
</div>

<main id="main-content" class="relative z-10 w-full flex-grow">
  <div id="cards-container" class="container mx-auto p-4 md:p-8 pt-6 md:pt-10">
    <div id="mainPage" class="grid gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>
    
    <main id="main-content" class="relative z-10 w-full flex-grow">
  <div id="cards-container" class="container mx-auto p-4 md:p-8 pt-6 md:pt-10">
    <div id="mainPage" class="grid gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>
    
    <div id="collectionPage" class="hidden">
      <div id="collectionGrid" class="grid gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>
    </div>

    <div id="deckPage" class="hidden flex flex-col lg:flex-row gap-8 items-start">
      <div class="lg:w-1/2 w-full bg-gray-900/40 border border-white/5 rounded-3xl p-6 shadow-inner">
        <h2 class="text-xl font-bold text-emerald-400 mb-4 flex items-center gap-2">
          <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
          Ma Collection
        </h2>
        <div id="deckSourceList" class="grid grid-cols-4 gap-4 max-h-[65vh] overflow-y-auto pr-2 custom-scrollbar"></div>
      </div>

      <div class="lg:w-1/2 w-full bg-gray-900/40 border border-white/5 rounded-3xl p-6 shadow-inner flex flex-col">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-purple-400 flex items-center gap-2">
            <span class="w-2 h-2 bg-purple-500 rounded-full animate-pulse"></span>
            Deck (Drag & Drop)
          </h2>
          <button id="clear-deck" class="px-4 py-2 text-[10px] font-black text-gray-400 hover:text-white hover:bg-red-500/20 rounded-xl border border-white/5 transition-all uppercase tracking-widest">
            Vider le deck
          </button>
        </div>
        <div id="deck-grid" class="grid grid-cols-3 sm:grid-cols-3 gap-4 flex-grow content-start">
          <div class="deck-slot aspect-[3/4] border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-gray-800 font-bold text-xl transition-all" data-slot="0">1</div>
          <div class="deck-slot aspect-[3/4] border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-gray-800 font-bold text-xl transition-all" data-slot="1">2</div>
          <div class="deck-slot aspect-[3/4] border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-gray-800 font-bold text-xl transition-all" data-slot="2">3</div>
          <div class="deck-slot aspect-[3/4] border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-gray-800 font-bold text-xl transition-all" data-slot="3">4</div>
          <div class="deck-slot aspect-[3/4] border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-gray-800 font-bold text-xl transition-all" data-slot="4">5</div>
          <div class="deck-slot aspect-[3/4] border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center text-gray-800 font-bold text-xl transition-all" data-slot="5">6</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="relative z-40 w-full glass-header border-t border-white/5 mt-auto">
  <div class="container mx-auto p-8 flex flex-col items-center text-center gap-6">
    <div>
      <h2 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-1">UmaMusume Card Collection</h2>
    </div>
    
    <div class="flex gap-8 text-sm font-medium text-gray-400">
        <a href="https://discord.gg/nRdxGje3zx" target="_blank" class="hover:text-emerald-400 transition-colors">Discord</a>
        <a href="https://gametora.com/umamusume" target="_blank" class="hover:text-emerald-400 transition-colors">Gametora</a>
    </div>

    <div class="pt-2">
      <p class="text-gray-600 text-[11px] tracking-tighter">© 2024 UmaMusume Card Collection — Developed by StrideX</p>
    </div>
  </div>
</footer>

<button id="back-to-top" class="fixed bottom-8 right-8 z-50 bg-emerald-600 hover:bg-emerald-500 text-white p-4 rounded-full shadow-2xl opacity-0 translate-y-10 pointer-events-none transition-all duration-300 active:scale-90">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
  </svg>
</button>

<script src="app.js"></script>
</body>
</html>
